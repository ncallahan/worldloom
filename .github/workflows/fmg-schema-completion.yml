name: FMG schema completion

on:
  push:
    branches:
      - experiments/fmg-schema-and-slices

permissions:
  contents: write

jobs:
  measure-and-generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate fixture attributes
        run: |
          set -euo pipefail
          for f in \
            "examples/Thimaland Full 2026-10-02-14-17.json" \
            "examples/Viveria Full 2026-10-02-11-31.json" \
            "examples/Pithigy Full 2026-10-02-11-35.json"
          do
            test "$(git check-attr diff -- "$f" | cut -d: -f3 | tr -d ' ')" = "unset"
            test "$(git check-attr linguist-generated -- "$f" | cut -d: -f3 | tr -d ' ')" = "set"
          done

      - name: Run FMG measurements
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python experiments/fmg_scale/measure_fmg.py \
            "examples/Thimaland Full 2026-10-02-14-17.json" \
            "examples/Viveria Full 2026-10-02-11-31.json" \
            "examples/Pithigy Full 2026-10-02-11-35.json" \
            --output experiments/fmg_scale/results/fmg_scale_h8_h9_2026-10-03.json

      - name: Generate observed schema digest
        run: |
          set -euo pipefail
          python experiments/fmg_scale/generate_fmg_digest.py \
            "examples/Thimaland Full 2026-10-02-14-17.json" \
            "examples/Viveria Full 2026-10-02-11-31.json" \
            "examples/Pithigy Full 2026-10-02-11-35.json" \
            --output docs/FMG_FULL_JSON_OBSERVED.md
          test "$(wc -c < docs/FMG_FULL_JSON_OBSERVED.md)" -lt 15000

      - name: Generate Viveria and Pithigy slice fixtures
        env:
          PYTHONPATH: experiments/fmg_scale
        run: |
          set -euo pipefail
          mkdir -p experiments/fmg_scale/slices
          python experiments/fmg_scale/make_slice.py \
            "examples/Viveria Full 2026-10-02-11-31.json" 1 1 \
            --output experiments/fmg_scale/slices/Viveria_burg1_hop1.json
          python experiments/fmg_scale/make_slice.py \
            "examples/Pithigy Full 2026-10-02-11-35.json" 1 1 \
            --output experiments/fmg_scale/slices/Pithigy_burg1_hop1.json

      - name: Run slice tests
        env:
          PYTHONPATH: experiments/fmg_scale
        run: python -m unittest discover experiments/fmg_scale -p 'test_*.py'

      - name: Commit generated measurement artifacts
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            docs/FMG_FULL_JSON_OBSERVED.md \
            experiments/fmg_scale/results/fmg_scale_h8_h9_2026-10-03.json \
            experiments/fmg_scale/slices/Viveria_burg1_hop1.json \
            experiments/fmg_scale/slices/Pithigy_burg1_hop1.json
          if git diff --cached --quiet; then
            echo "No generated artifact changes."
          else
            git commit -m "chore: record FMG schema and slice experiment outputs"
            git push
          fi
