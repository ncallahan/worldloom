name: Ruff lint discovery

on:
  pull_request:

permissions:
  contents: read

jobs:
  discovery:
    name: Ruff discovery
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned Ruff
        run: python -m pip install "ruff==0.16.10"

      - name: Base rule set
        run: ruff check . --output-format=concise --statistics --exit-zero

      - name: Candidate B006
        run: ruff check . --select B006 --output-format=concise --statistics --exit-zero

      - name: Candidate B015
        run: ruff check . --select B015 --output-format=concise --statistics --exit-zero

      - name: Candidate B017
        run: ruff check . --select B017 --output-format=concise --statistics --exit-zero

      - name: Candidate B018
        run: ruff check . --select B018 --output-format=concise --exit-zero

      - name: Candidate B904
        run: ruff check . --select B904 --output-format=concise --statistics --exit-zero

      - name: Candidate E501 at 100
        run: ruff check . --select E501 --line-length 100 --output-format=concise --statistics --exit-zero

      - name: Candidate E501 at 120
        run: ruff check . --select E501 --line-length 120 --output-format=concise --statistics --exit-zero

      - name: Candidate I
        run: ruff check . --select I --output-format=concise --statistics --exit-zero

      - name: Candidate UP
        run: ruff check . --select UP --output-format=concise --statistics --exit-zero

      - name: Candidate W
        run: ruff check . --select W --output-format=concise --statistics --exit-zero
