name: FMG spatial boundary experiment

on:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Run experiment
        env:
          PYTHONPATH: src
        run: python experiments/fmg-spatial-boundary/run.py
      - name: Upload raw result
        uses: actions/upload-artifact@v4
        with:
          name: fmg-spatial-boundary-raw
          path: experiments/fmg-spatial-boundary/results/raw-results.json
