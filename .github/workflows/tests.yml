name: Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install pinned Ruff
        run: python -m pip install "ruff==0.16.10"

      - name: Provenance header
        # pull_request runs test the merge of head into base, so print both SHAs.
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -u
          echo "event_name=$GITHUB_EVENT_NAME"
          echo "github_sha=$GITHUB_SHA"
          echo "pull_request_head_sha=$PR_HEAD_SHA"
          echo "github_ref=$GITHUB_REF"
          python --version
          for package in pytest numpy rasterio ruff; do
            python -c "import importlib.metadata as m; print('$package='+m.version('$package'))" 2>/dev/null || echo "$package=not-installed"
          done

      - name: Run Ruff
        run: ruff check .

  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Provenance header
        # pull_request runs test the merge of head into base, so print both SHAs.
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -u
          echo "event_name=$GITHUB_EVENT_NAME"
          echo "github_sha=$GITHUB_SHA"
          echo "pull_request_head_sha=$PR_HEAD_SHA"
          echo "github_ref=$GITHUB_REF"
          python --version
          for package in pytest numpy rasterio ruff; do
            python -c "import importlib.metadata as m; print('$package='+m.version('$package'))" 2>/dev/null || echo "$package=not-installed"
          done

      - name: Run unit tests
        run: python -m pytest -q tests/unit

  python-311-tests:
    name: Python 3.11 tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 70

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Provenance header
        # pull_request runs test the merge of head into base, so print both SHAs.
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -u
          echo "event_name=$GITHUB_EVENT_NAME"
          echo "github_sha=$GITHUB_SHA"
          echo "pull_request_head_sha=$PR_HEAD_SHA"
          echo "github_ref=$GITHUB_REF"
          python --version
          for package in pytest numpy rasterio ruff; do
            python -c "import importlib.metadata as m; print('$package='+m.version('$package'))" 2>/dev/null || echo "$package=not-installed"
          done

      - name: Run unit tests
        run: python -m pytest -q tests/unit

      - name: Run experiment tests
        run: python -m pytest -q tests/experiments

  experiment-tests:
    name: Experiment tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Provenance header
        # pull_request runs test the merge of head into base, so print both SHAs.
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -u
          echo "event_name=$GITHUB_EVENT_NAME"
          echo "github_sha=$GITHUB_SHA"
          echo "pull_request_head_sha=$PR_HEAD_SHA"
          echo "github_ref=$GITHUB_REF"
          python --version
          for package in pytest numpy rasterio ruff; do
            python -c "import importlib.metadata as m; print('$package='+m.version('$package'))" 2>/dev/null || echo "$package=not-installed"
          done

      - name: Run experiment tests
        run: python -m pytest -q tests/experiments


  coverage-informational:
    name: Coverage (informational)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 70
    continue-on-error: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install "pytest-cov==6.2.1"

      - name: Provenance header
        # pull_request runs test the merge of head into base, so print both SHAs.
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -u
          echo "event_name=$GITHUB_EVENT_NAME"
          echo "github_sha=$GITHUB_SHA"
          echo "pull_request_head_sha=$PR_HEAD_SHA"
          echo "github_ref=$GITHUB_REF"
          python --version
          for package in pytest numpy rasterio ruff; do
            python -c "import importlib.metadata as m; print('$package='+m.version('$package'))" 2>/dev/null || echo "$package=not-installed"
          done

      - name: Run coverage
        run: |
          set -o pipefail
          python -m pytest             --cov=src/worldloom             --cov-branch             --cov-report=term-missing             tests/unit tests/experiments | tee coverage.txt

      - name: Publish coverage summary
        if: always()
        run: |
          echo "## Coverage (informational)" >> "$GITHUB_STEP_SUMMARY"
          cat coverage.txt >> "$GITHUB_STEP_SUMMARY"

  fmg-digest-reproducibility-informational:
    name: FMG digest reproducibility (informational)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 45
    continue-on-error: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Provenance header
        # pull_request runs test the merge of head into base, so print both SHAs.
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -u
          echo "event_name=$GITHUB_EVENT_NAME"
          echo "github_sha=$GITHUB_SHA"
          echo "pull_request_head_sha=$PR_HEAD_SHA"
          echo "github_ref=$GITHUB_REF"
          python --version
          for package in pytest numpy rasterio ruff; do
            python -c "import importlib.metadata as m; print('$package='+m.version('$package'))" 2>/dev/null || echo "$package=not-installed"
          done

      - name: Compare generated digest with committed reference
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          output="$tmpdir/fmg-full-json-observed.md"
          python experiments/fmg_scale/generate_fmg_digest.py             "examples/Thimaland Full 2026-10-02-14-17.json"             "examples/Viveria Full 2026-10-02-11-31.json"             "examples/Pithigy Full 2026-10-02-11-35.json"             --output "$output"
          if cmp -s "$output" references/fmg-full-json-observed.md; then
            echo "FMG digest reproducibility: identical"
          else
            echo "FMG digest reproducibility: DIFFERENT"
            diff -u references/fmg-full-json-observed.md "$output" || true
            if diff -u               <(sed '/^Generating command:/d' references/fmg-full-json-observed.md)               <(sed '/^Generating command:/d' "$output") >/dev/null; then
              echo "Classification: generating-command line only"
            else
              echo "Classification: differences beyond the generating-command line"
            fi
          fi

  fmg-schema-measurement:
    name: FMG schema and H8/H9 measurement
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 120
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Provenance header
        # pull_request runs test the merge of head into base, so print both SHAs.
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -u
          echo "event_name=$GITHUB_EVENT_NAME"
          echo "github_sha=$GITHUB_SHA"
          echo "pull_request_head_sha=$PR_HEAD_SHA"
          echo "github_ref=$GITHUB_REF"
          python --version
          for package in pytest numpy rasterio ruff; do
            python -c "import importlib.metadata as m; print('$package='+m.version('$package'))" 2>/dev/null || echo "$package=not-installed"
          done

      - name: Validate fixture attributes
        run: |
          set -euo pipefail
          for f in \
            "examples/Thimaland Full 2026-10-02-14-17.json" \
            "examples/Viveria Full 2026-10-02-11-31.json" \
            "examples/Pithigy Full 2026-10-02-11-35.json"
          do
            git check-attr -a -- "$f"
            test "$(git check-attr diff -- "$f" | cut -d: -f3 | tr -d ' ')" = "unset"
            test "$(git check-attr linguist-generated -- "$f" | cut -d: -f3 | tr -d ' ')" = "set"
          done

      - name: Check FMG numeric serialization
        run: |
          set -euo pipefail
          python experiments/fmg_scale/check_numeric_serialization.py \
            "examples/Thimaland Full 2026-10-02-14-17.json" \
            "examples/Viveria Full 2026-10-02-11-31.json" \
            "examples/Pithigy Full 2026-10-02-11-35.json" | head -c 4000

      - name: Run H8/H9 measurements
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python experiments/fmg_scale/measure_fmg.py \
            "examples/Thimaland Full 2026-10-02-14-17.json" \
            "examples/Viveria Full 2026-10-02-11-31.json" \
            "examples/Pithigy Full 2026-10-02-11-35.json" \
            --output experiments/fmg_scale/results/fmg_scale_h8_h9_2026-10-03.json

      - name: Upload H8/H9 raw results
        uses: actions/upload-artifact@v4
        with:
          name: fmg-h8-h9-results
          path: experiments/fmg_scale/results/fmg_scale_h8_h9_2026-10-03.json

      - name: Generate observed schema digest
        run: |
          set -euo pipefail
          python experiments/fmg_scale/generate_fmg_digest.py \
            "examples/Thimaland Full 2026-10-02-14-17.json" \
            "examples/Viveria Full 2026-10-02-11-31.json" \
            "examples/Pithigy Full 2026-10-02-11-35.json" \
            --output references/fmg-full-json-observed.md
          test "$(wc -c < references/fmg-full-json-observed.md)" -lt 15000

      - name: Validate generated slice attributes
        run: |
          set -euo pipefail
          for f in \
            experiments/fmg_scale/slices/Viveria_burg1_hop3.json \
            experiments/fmg_scale/slices/Pithigy_burg1_hop3.json \
            experiments/fmg_scale/slices/Viveria_burg1_hop3.json.remap.json \
            experiments/fmg_scale/slices/Pithigy_burg1_hop3.json.remap.json
          do
            test "$(git check-attr diff -- "$f" | cut -d: -f3 | tr -d ' ')" = "unset"
            test "$(git check-attr linguist-generated -- "$f" | cut -d: -f3 | tr -d ' ')" = "set"
          done

      - name: Generate slice fixtures
        env:
          PYTHONPATH: experiments/fmg_scale
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          for stem in Viveria Pithigy; do
            case "$stem" in
              Viveria) src="examples/Viveria Full 2026-10-02-11-31.json"; burg=1 ;;
              Pithigy) src="examples/Pithigy Full 2026-10-02-11-35.json"; burg=1 ;;
            esac
            python experiments/fmg_scale/make_slice.py "$src" "$burg" 3 --output "$tmpdir/$stem.json"
            python experiments/fmg_scale/make_slice.py "$src" "$burg" 3 --output "$tmpdir/$stem-repeat.json"
            test "$(sha256sum "$tmpdir/$stem.json" | cut -d' ' -f1)" = "$(sha256sum "$tmpdir/$stem-repeat.json" | cut -d' ' -f1)"
            cp "$tmpdir/$stem.json" "experiments/fmg_scale/slices/${stem}_burg1_hop3.json"
            cp "$tmpdir/$stem.json.remap.json" "experiments/fmg_scale/slices/${stem}_burg1_hop3.json.remap.json"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          for stem in ("Viveria", "Pithigy"):
              p = Path("experiments/fmg_scale/slices") / f"{stem}_burg1_hop3.json"
              d = json.loads(p.read_text())
              cells = d["pack"]["cells"]
              rivers = d["pack"]["rivers"]
              assert 30 <= len(cells) <= 80, (stem, len(cells))
              assert p.stat().st_size < 100_000, (stem, p.stat().st_size)
              assert any(len([x for x in r.get("cells", []) if isinstance(x, int) and x >= 0]) >= 2 for r in rivers)
              assert any(r.get("neighbors") for r in d["pack"]["states"])
              assert any(r.get("diplomacy") for r in d["pack"]["states"])
              assert d["pack"]["burgs"][0] == 0 and d["pack"]["provinces"][0] == 0
              assert d["pack"]["routes"] and d["pack"]["markers"] and d["pack"]["provinces"][1:]
              grid_ids = [c["g"] for c in cells if isinstance(c.get("g"), int)]
              assert any(grid_ids.count(g) > 1 for g in set(grid_ids)), (stem, grid_ids)
              if stem == "Pithigy":
                  assert any(-1 in r.get("cells", []) for r in rivers)
          PY

      - name: Run slice tests
        env:
          PYTHONPATH: experiments/fmg_scale
        run: python -m unittest discover experiments/fmg_scale -p 'test_make_slice.py'

      - name: Upload FMG measurement artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fmg-schema-completion
          path: |
            references/fmg-full-json-observed.md
            experiments/fmg_scale/results/fmg_scale_h8_h9_2026-10-03.json
            experiments/fmg_scale/slices/Viveria_burg1_hop3.json
            experiments/fmg_scale/slices/Pithigy_burg1_hop3.json
            experiments/fmg_scale/slices/Viveria_burg1_hop3.json.remap.json
            experiments/fmg_scale/slices/Pithigy_burg1_hop3.json.remap.json
