name: Tests

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run unit tests
        run: python -m pytest -q tests/unit

  experiment-tests:
    name: Experiment tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run experiment tests
        run: python -m pytest -q tests/experiments


  fmg-schema-measurement:
    name: FMG schema and H8/H9 measurement
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Validate fixture attributes
        run: |
          set -euo pipefail
          for f in \
            "examples/Thimaland Full 2026-10-02-14-17.json" \
            "examples/Viveria Full 2026-10-02-11-31.json" \
            "examples/Pithigy Full 2026-10-02-11-35.json"
          do
            test "$(git check-attr diff -- "$f" | cut -d: -f3 | tr -d ' ')" = "unset"
            test "$(git check-attr linguist-generated -- "$f" | cut -d: -f3 | tr -d ' ')" = "set"
          done

      - name: Run H8/H9 measurements
        env:
          PYTHONPATH: src
        run: |
          set -euo pipefail
          python experiments/fmg_scale/measure_fmg.py \
            "examples/Thimaland Full 2026-10-02-14-17.json" \
            "examples/Viveria Full 2026-10-02-11-31.json" \
            "examples/Pithigy Full 2026-10-02-11-35.json" \
            --output experiments/fmg_scale/results/fmg_scale_h8_h9_2026-10-03.json

      - name: Upload H8/H9 raw results
        uses: actions/upload-artifact@v4
        with:
          name: fmg-h8-h9-results
          path: experiments/fmg_scale/results/fmg_scale_h8_h9_2026-10-03.json

      - name: Generate observed schema digest
        run: |
          set -euo pipefail
          python experiments/fmg_scale/generate_fmg_digest.py \
            "examples/Thimaland Full 2026-10-02-14-17.json" \
            "examples/Viveria Full 2026-10-02-11-31.json" \
            "examples/Pithigy Full 2026-10-02-11-35.json" \
            --output docs/FMG_FULL_JSON_OBSERVED.md
          test "$(wc -c < docs/FMG_FULL_JSON_OBSERVED.md)" -lt 15000

      - name: Generate slice fixtures
        env:
          PYTHONPATH: experiments/fmg_scale
        run: |
          set -euo pipefail
          mkdir -p experiments/fmg_scale/slices
          python experiments/fmg_scale/make_slice.py \
            "examples/Viveria Full 2026-10-02-11-31.json" 1 0 \
            --output experiments/fmg_scale/slices/Viveria_burg1_hop0.json
          python experiments/fmg_scale/make_slice.py \
            "examples/Pithigy Full 2026-10-02-11-35.json" 1 0 \
            --output experiments/fmg_scale/slices/Pithigy_burg1_hop0.json

      - name: Run slice tests
        env:
          PYTHONPATH: experiments/fmg_scale
        run: python -m unittest discover experiments/fmg_scale -p 'test_make_slice.py'

      - name: Upload FMG measurement artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fmg-schema-completion
          path: |
            docs/FMG_FULL_JSON_OBSERVED.md
            experiments/fmg_scale/results/fmg_scale_h8_h9_2026-10-03.json
            experiments/fmg_scale/slices/Viveria_burg1_hop0.json
            experiments/fmg_scale/slices/Pithigy_burg1_hop0.json


  fmg-artifact-writeback:
    name: FMG artifact writeback (temporary)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Replay verified H8/H9 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/ncallahan/worldloom/actions/artifacts/11268964348/zip" \
            -o /tmp/fmg-h8-h9.zip
          mkdir -p experiments/fmg_scale/results
          unzip -j /tmp/fmg-h8-h9.zip \
            "fmg_scale_h8_h9_2026-10-03.json" \
            -d experiments/fmg_scale/results

      - name: Generate schema digest
        run: |
          set -euo pipefail
          python experiments/fmg_scale/generate_fmg_digest.py \
            "examples/Thimaland Full 2026-10-02-14-17.json" \
            "examples/Viveria Full 2026-10-02-11-31.json" \
            "examples/Pithigy Full 2026-10-02-11-35.json" \
            --output docs/FMG_FULL_JSON_OBSERVED.md
          test "$(wc -c < docs/FMG_FULL_JSON_OBSERVED.md)" -lt 15000

      - name: Generate and test slice fixtures
        env:
          PYTHONPATH: experiments/fmg_scale
        run: |
          set -euo pipefail
          mkdir -p experiments/fmg_scale/slices
          python experiments/fmg_scale/make_slice.py \
            "examples/Viveria Full 2026-10-02-11-31.json" 1 0 \
            --output experiments/fmg_scale/slices/Viveria_burg1_hop0.json
          python experiments/fmg_scale/make_slice.py \
            "examples/Pithigy Full 2026-10-02-11-35.json" 1 0 \
            --output experiments/fmg_scale/slices/Pithigy_burg1_hop0.json
          python -m unittest discover experiments/fmg_scale -p 'test_make_slice.py'

      - name: Commit generated artifacts
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            docs/FMG_FULL_JSON_OBSERVED.md \
            experiments/fmg_scale/results/fmg_scale_h8_h9_2026-10-03.json \
            experiments/fmg_scale/slices/Viveria_burg1_hop0.json \
            experiments/fmg_scale/slices/Pithigy_burg1_hop0.json
          if git diff --cached --quiet; then
            echo "No artifact changes"
          else
            git commit -m "chore: record FMG schema, H8/H9, and slice outputs"
            git push
          fi
