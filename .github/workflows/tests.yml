name: Tests

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run unit tests
        run: python -m pytest -q tests/unit

  experiment-tests:
    name: Experiment tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run experiment tests
        run: python -m pytest -q tests/experiments


  fixture-integrity:
    name: FMG fixture integrity
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Verify immutable FMG reference fixtures
        shell: bash
        run: |
          set -euo pipefail

          check_fixture() {
            local path="$1"
            local expected="$2"
            local actual
            local size

            test -f "$path"
            actual="$(sha256sum "$path" | cut -d " " -f1)"
            size="$(wc -c < "$path")"
            echo "Fixture bytes:         $path -> $size"

            if [[ "$actual" != "$expected" ]]; then
              echo "Fixture hash mismatch: $path"
              echo "Expected SHA-256:       $expected"
              echo "Actual SHA-256:         $actual"
              exit 1
            fi
          }

          check_fixture "examples/Thimaland Full 2026-10-02-14-17.json" "d37a94173eb66d4aae73312838e9e100e43a95f1b7be7c0b6af2b3186db99423"
          check_fixture "examples/Pithigy Full 2026-10-02-11-35.json" "da0840bcc03fb32671ff6d5046a14123ba57cc15a0e85c208ba1b2a61d11914f"
          check_fixture "examples/Viveria Full 2026-10-02-11-31.json" "1f8e992f29dfdd778a7e7c39b16db21ab3dcd8a26cff03676ec745748695b643"
