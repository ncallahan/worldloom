name: Temporary FMG spatial-boundary follow-up
on:
  push:
    paths:
      - "experiments/fmg-spatial-boundary/run_followup.py"
      - "experiments/fmg-spatial-boundary/results/**"
      - ".github/workflows/tmp-fmg-spatial-followup.yml"
jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run follow-up
        run: python experiments/fmg-spatial-boundary/run_followup.py
      - name: Commit raw result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/fmg-spatial-boundary/results/followup-2026-10-04.json
          git diff --cached --quiet || git commit -m "Record FMG spatial-boundary follow-up results"
          git push
