[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "worldloom"
version = "0.1.0"
description = "A modular framework for constructing, simulating, and exploring persistent computational worlds."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
worldloom = "worldloom.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "rasterio>=1.4",
    "numpy>=2",
]
gis = [
    "rasterio>=1.4",
]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["F", "E4", "E7", "E9", "W605", "B006", "B015", "B017", "B018", "B904"]
ignore = [
    "E401", # repository uses compact style; style rule, not a defect
    "E701", # repository uses compact style; style rule, not a defect
    "E702", # repository uses compact style; style rule, not a defect
    "E731", # repository uses compact style; style rule, not a defect
    "E741", # repository uses compact style; style rule, not a defect
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
